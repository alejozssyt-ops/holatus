name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [aplanar, elytra-armor-mod, retrogen-mods, unbreakable]
    defaults:
      run:
        working-directory: ${{ matrix.mod }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew build --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.mod }}-jar
          path: ${{ matrix.mod }}/build/libs/*.jar
